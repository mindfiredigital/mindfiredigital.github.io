name: Continuous Integration Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 'Build Mindfire FOSS application'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4  

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install dependencies'
        run: npm install

      - name: 'Build application'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: 'Debug - Inspect generated contributor data'
        run: |
          echo "===== contributors.json ====="
          echo "Total contributors: $(jq 'length' src/asset/contributors.json)"
          echo ""
          echo "--- All contributor logins ---"
          jq -r '.[].login' src/asset/contributors.json
          echo ""
          echo "===== contributor-mapping.json ====="
          echo "Total mapped logins: $(jq 'keys | length' src/asset/contributor-mapping.json)"
          echo ""
          echo "--- All mapped logins ---"
          jq -r 'keys[]' src/asset/contributor-mapping.json
          echo ""
          echo "===== GitHub API rate limit status ====="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/rate_limit | jq '.rate'

      - name: 'Restore changes in json'
        run: |
          git restore src/asset/*.json

      - name: 'Fetch branches'
        run: git fetch origin

      - name: 'Set Git user name and email'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: 'Copy leaderboard data to temp before branch switch'
        run: |
          mkdir -p /tmp/leaderboard-data
          cp -r public/leaderboard/* /tmp/leaderboard-data/

      - name: 'Restore generated leaderboard files to allow branch switch'
        run: |
          git restore public/leaderboard/

      - name: 'Copy build artifacts to gh-pages branch'
        run: |
          mkdir /tmp/temp-directory
          shopt -s dotglob
          cp -r build/* /tmp/temp-directory/
          shopt -u dotglob
          mkdir -p /tmp/temp-directory/leaderboard
          cp -r /tmp/leaderboard-data/* /tmp/temp-directory/leaderboard/
          git checkout gh-pages
          rm -rf *
          rm -rf .nojekyll
          shopt -s dotglob
          cp -r /tmp/temp-directory/* .
          shopt -u dotglob
          # Ensure .next cache is never deployed
          rm -rf .next

      - name: 'Commit and push to gh-pages if changes exist'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add . -f
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Copy build artifacts from main to gh-pages branch"
            git push origin gh-pages
          fi

      - name: 'Switch back to main branch'
        run: |
          git checkout main

  create-github-release:
    name: Create Github release document
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Semantic Release
        run: npx semantic-release@22.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}